<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AnimeEnigma Presence</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="hero">
        <h1>AnimeEnigma</h1>
        <p id="subtitle" class="sub">Discord Rich Presence</p>
      </header>

      <section class="card">
        <label class="row">
          <span id="labelEnabled">Enabled</span>
          <span class="switch">
            <input id="enabled" type="checkbox" role="switch" />
            <span class="switch-ui" aria-hidden="true"></span>
          </span>
        </label>

        <label class="row">
          <span id="labelShowProfile">Profile button in activity</span>
          <span class="switch">
            <input id="showProfileButton" type="checkbox" role="switch" />
            <span class="switch-ui" aria-hidden="true"></span>
          </span>
        </label>

        <div class="field">
          <span id="labelLocale" class="field-label">Activity language</span>
          <div class="locale-toggle" role="radiogroup" aria-labelledby="labelLocale">
            <button type="button" class="locale-btn" data-locale="ru" aria-pressed="false">RU</button>
            <button type="button" class="locale-btn" data-locale="en" aria-pressed="false">EN</button>
            <button type="button" class="locale-btn" data-locale="ja" aria-pressed="false">JP</button>
          </div>
        </div>
      </section>

      <div id="status" class="status" role="status">Checking…</div>

      <details class="advanced">
        <summary id="labelAdvanced">Advanced</summary>
        <label class="field bridge-field">
          <span id="labelBridge" class="field-label">Local bridge address</span>
          <input id="bridgeUrl" type="text" spellcheck="false" autocomplete="off" placeholder="http://127.0.0.1:3847" />
        </label>
        <p id="bridgeHint" class="hint">Only change this if the companion app uses another port.</p>
      </details>

      <p id="saveHint" class="save-hint" hidden></p>
    </main>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
